name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: backend
            context: ./apps/backend
          - service: frontend
            context: ./apps/frontend
          - service: contract-ai
            context: ./apps/contract-ai
          - service: deliverable-verification-ai
            context: ./apps/deliverable-verification-ai
          - service: creator-graph-ai
            context: ./apps/creator-graph-ai
          - service: pricing-engine-ai
            context: ./apps/pricing-engine-ai
          - service: campaign-agent-ai
            context: ./apps/campaign-agent-ai
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/conic-${{ matrix.service }}:$IMAGE_TAG \
            -t $ECR_REGISTRY/conic-${{ matrix.service }}:latest \
            ${{ matrix.context }}
          docker push $ECR_REGISTRY/conic-${{ matrix.service }}:$IMAGE_TAG
          docker push $ECR_REGISTRY/conic-${{ matrix.service }}:latest

  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update ECS services
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          services=(backend frontend contract-ai deliverable-verification-ai creator-graph-ai pricing-engine-ai campaign-agent-ai)
          for service in "${services[@]}"; do
            aws ecs update-service \
              --cluster conic-cluster \
              --service conic-$service \
              --force-new-deployment \
              --region ${{ env.AWS_REGION }}
          done

      - name: Wait for services stable
        run: |
          services=(backend frontend)
          for service in "${services[@]}"; do
            aws ecs wait services-stable \
              --cluster conic-cluster \
              --services conic-$service \
              --region ${{ env.AWS_REGION }}
          done
