name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

jobs:
  # Gate the whole pipeline on AWS credentials being configured. `secrets`
  # cannot be referenced directly in a job-level `if:`, so a tiny job resolves
  # their presence into an output the deploy jobs depend on. When they are
  # absent (e.g. forks, or before infra is wired up) the downstream jobs are
  # skipped and the run concludes green instead of failing at the AWS step.
  check-secrets:
    name: Check AWS credentials
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          if [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$AWS_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AWS credentials not configured — skipping Docker build & ECS deploy."
          fi

  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: check-secrets
    if: needs.check-secrets.outputs.configured == 'true'
    strategy:
      matrix:
        include:
          - service: backend
            context: ./apps/backend
          - service: frontend
            context: ./apps/frontend
          - service: contract-ai
            context: ./apps/contract-ai
          - service: deliverable-verification-ai
            context: ./apps/deliverable-verification-ai
          - service: creator-graph-ai
            context: ./apps/creator-graph-ai
          - service: pricing-engine-ai
            context: ./apps/pricing-engine-ai
          - service: campaign-agent-ai
            context: ./apps/campaign-agent-ai
          - service: performance-prediction-ai
            context: ./apps/performance-prediction-ai
          - service: nil-compliance-ai
            context: ./apps/nil-compliance-ai
          - service: fraud-detection-ai
            context: ./apps/fraud-detection-ai
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/conic-${{ matrix.service }}:$IMAGE_TAG \
            -t $ECR_REGISTRY/conic-${{ matrix.service }}:latest \
            ${{ matrix.context }}
          docker push $ECR_REGISTRY/conic-${{ matrix.service }}:$IMAGE_TAG
          docker push $ECR_REGISTRY/conic-${{ matrix.service }}:latest

  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: [check-secrets, build-and-push]
    if: needs.check-secrets.outputs.configured == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update ECS services
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          services=(backend frontend contract-ai deliverable-verification-ai creator-graph-ai pricing-engine-ai campaign-agent-ai performance-prediction-ai nil-compliance-ai fraud-detection-ai)
          for service in "${services[@]}"; do
            aws ecs update-service \
              --cluster conic-cluster \
              --service conic-$service \
              --force-new-deployment \
              --region ${{ env.AWS_REGION }}
          done

      - name: Wait for services stable
        run: |
          services=(backend frontend)
          for service in "${services[@]}"; do
            aws ecs wait services-stable \
              --cluster conic-cluster \
              --services conic-$service \
              --region ${{ env.AWS_REGION }}
          done
