  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: conic-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    depends_on:
      - backend

volumes:
  pgdata:
  redis_data:
