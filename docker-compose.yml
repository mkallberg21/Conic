services:
  postgres:
    image: postgres:16
    container_name: conic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: conic
      POSTGRES_PASSWORD: conic
      POSTGRES_DB: conic
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: conic-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pgdata:
