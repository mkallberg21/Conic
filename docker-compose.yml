services:
  postgres:
    image: postgres:16-alpine
    container_name: conic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-conic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-conic}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-conic}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: conic-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: conic-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-conic}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-conic}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set}"
      INTERNAL_API_SECRET: "${INTERNAL_API_SECRET:?INTERNAL_API_SECRET must be set}"
      DWOLLA_KEY: ${DWOLLA_KEY:-}
      DWOLLA_SECRET: ${DWOLLA_SECRET:-}
      DWOLLA_ENVIRONMENT: ${DWOLLA_ENVIRONMENT:-sandbox}
      DWOLLA_MASTER_FUNDING_SOURCE_URL: ${DWOLLA_MASTER_FUNDING_SOURCE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CONTRACT_AI_URL: http://contract-ai:8001
      DELIVERABLE_AI_URL: http://deliverable-verification-ai:8002
      CREATOR_GRAPH_AI_URL: http://creator-graph-ai:8003
      PRICING_ENGINE_AI_URL: http://pricing-engine-ai:8004
      CAMPAIGN_AGENT_AI_URL: http://campaign-agent-ai:8005
      PERFORMANCE_PREDICTION_AI_URL: http://performance-prediction-ai:8006
      NIL_COMPLIANCE_AI_URL: http://nil-compliance-ai:8007
      FRAUD_DETECTION_AI_URL: http://fraud-detection-ai:8008
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      NODE_ENV: production
      APP_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  contract-ai:
    build:
      context: ./apps/contract-ai
      dockerfile: Dockerfile
    container_name: conic-contract-ai
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?INTERNAL_API_SECRET must be set}
      BACKEND_ORIGIN: http://backend:4000
      APP_ENV: production

  deliverable-verification-ai:
