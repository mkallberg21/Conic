apiVersion: apps/v1
kind: Deployment
metadata:
  name: contract-ai
  namespace: conic
spec:
  replicas: 1
  selector:
    matchLabels:
      app: contract-ai
  template:
    metadata:
      labels:
        app: contract-ai
    spec:
      containers:
        - name: contract-ai
          image: ${ECR_REGISTRY}/conic-contract-ai:latest
          ports:
            - containerPort: 8001
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: conic-secrets
                  key: OPENAI_API_KEY
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: contract-ai-svc
  namespace: conic
spec:
  selector:
    app: contract-ai
  ports:
    - port: 8001
      targetPort: 8001
---
